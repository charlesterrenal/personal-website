server {
    listen 3000;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # "always" also sends these on 404 responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Turnstile: challenges.cloudflare.com; fonts: Google Fonts; contact form: n8n webhook.
    # style-src needs 'unsafe-inline' because react-zoom-pan-pinch injects a <style> tag at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://n8n.charlesterrenal.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
